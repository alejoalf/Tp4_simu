<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Simulación Vacunatorio – TP4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#000;
 --panel:#0E0E0E;
 --fg:#E4E4E1;
 --mute:#8C8C87;
 --faint:#5A5A56;
 --bd:#232322;
 --bd2:#333331;
 --hd:#121212;
 --rnd:#16142A; --hd-rnd:#1E1B3A;    /* números aleatorios */
 --acc:#0F2018; --hd-acc:#163024;    /* acumuladores */
 --hd-tmp:#1F1B12;                   /* objetos temporales */
 --sel:#4D3D00; --sel-fg:#FFF4C2;    /* fila seleccionada */
 --fin:#0F3321;                      /* última fila */
 --sans:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;
 --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
::selection{background:#3a3a38}

/* ---------- distribución ---------- */
.app{display:grid;grid-template-columns:350px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:26px 22px;border-right:1px solid var(--bd)}
.main{display:flex;flex-direction:column;height:100vh;padding:26px 26px 20px;min-width:0}

header{margin-bottom:26px}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
header p{margin:4px 0 0;font-size:13px;color:var(--mute)}

h2{margin:0;font-size:14px;font-weight:600}
h2 small{font-weight:400;font-size:13px;color:var(--mute)}

/* ---------- parámetros (los genera el script) ---------- */
#params{display:grid;gap:4px;margin-top:10px}
#params label{display:grid;grid-template-columns:1fr 92px;align-items:center;gap:12px;font-size:13px;color:#C9C9C5}
#params label:nth-child(5)::before,#params label:nth-child(11)::before{
 grid-column:1/-1;display:block;margin:14px 0 4px;padding-top:12px;border-top:1px solid var(--bd);font-size:12px;color:var(--mute)}
#params label:nth-child(5)::before{content:"Modelo"}
#params label:nth-child(11)::before{content:"Generador congruencial mixto"}
input{width:100%;padding:5px 8px;border:1px solid var(--bd2);border-radius:3px;background:var(--panel);color:var(--fg);font:13px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
input:hover{border-color:#4a4a47}
input:focus-visible{outline:none;border-color:var(--fg)}

button{width:100%;margin-top:20px;padding:9px 16px;border:1px solid var(--fg);border-radius:3px;background:var(--fg);color:#000;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#fff}
button:active{background:#bdbdb9}
button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
#msg{font-size:12.5px;margin-top:10px;color:var(--mute);min-height:1.5em}

/* ---------- resultados ---------- */
#res{display:grid;grid-template-columns:1fr 1fr 1fr;margin:12px 0 28px;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.k{padding:14px 20px 14px 0}
.k+.k{padding-left:20px;border-left:1px solid var(--bd)}
.k b{display:block;font-size:24px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.k span{display:block;margin-top:2px;font-size:12.5px;color:var(--mute)}
.k:nth-child(3) b{font-size:15px;padding-top:6px;color:#C9C9C5}

/* ---------- vector de estado ---------- */
.vec{display:flex;flex-direction:column;flex:1;min-height:0}
.vhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px;margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0;padding:0;list-style:none;font-size:12px;color:var(--mute)}
.legend li{display:flex;align-items:center;gap:6px}
.legend li::before{content:"";width:10px;height:10px;background:var(--c);outline:1px solid var(--bd2)}

#wrap{flex:1;min-height:320px;height:62vh;overflow:auto;border:1px solid var(--bd);background:var(--bg);overflow-anchor:none}
table{border-collapse:separate;border-spacing:0;font:11.5px var(--mono);white-space:nowrap;table-layout:fixed;font-variant-numeric:tabular-nums;color:#D6D6D2}
th,td{padding:0 6px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);text-align:right;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
td{height:22px;line-height:21px}
th{position:sticky;background:var(--hd);height:24px;text-align:center;z-index:2;font:500 12px var(--sans);color:var(--fg)}
thead tr:first-child th{top:0}
thead tr:nth-child(2) th{top:24px;height:26px;font-weight:400;color:var(--mute);border-bottom-color:var(--bd2)}
thead tr:first-child th:nth-child(2),thead tr:first-child th:nth-child(3){background:var(--hd-rnd)}
thead tr:first-child th:nth-child(8){background:var(--hd-acc)}
thead tr:first-child th:nth-child(n+9){background:var(--hd-tmp)}
thead tr:nth-child(2) th:nth-child(5),thead tr:nth-child(2) th:nth-child(7),thead tr:nth-child(2) th:nth-child(10),thead tr:nth-child(2) th:nth-child(12){background:var(--hd-rnd)}
thead tr:nth-child(2) th:nth-child(n+25):nth-child(-n+27){background:var(--hd-acc)}
tbody td:nth-child(5),tbody td:nth-child(7),tbody td:nth-child(10),tbody td:nth-child(12){background:var(--rnd)}
tbody td:nth-child(n+25):nth-child(-n+27){background:var(--acc)}
td:nth-child(1){color:var(--faint)}
td:nth-child(2){text-align:left;font-family:var(--sans);font-size:12px;color:var(--fg)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#151515}
tbody tr.sel td{background:var(--sel);color:var(--sel-fg)}
tbody tr.fin td{background:var(--fin);color:#fff;font-weight:500}
tbody tr.esp td{border:0;padding:0;height:auto;background:transparent}

#wrap::-webkit-scrollbar{width:12px;height:12px}
#wrap::-webkit-scrollbar-track{background:var(--bg)}
#wrap::-webkit-scrollbar-thumb{background:#2c2c2a;border:3px solid var(--bg);border-radius:6px}
#wrap::-webkit-scrollbar-corner{background:var(--bg)}

/* ---------- pantallas angostas ---------- */
@media (max-width:900px){
 .app{display:block}
 .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--bd);padding:20px 16px}
 .main{height:auto;padding:20px 16px}
 #res{grid-template-columns:1fr}
 .k+.k{padding-left:0;border-left:0;border-top:1px solid var(--bd)}
 #wrap{flex:none;height:70vh}
}
</style></head><body>
<div class="app">
<aside class="side">
 <header>
  <h1>Vacunatorio A</h1>
  <p>TP4 de Simulación, grupo 7, 4K4</p>
 </header>
 <h2>Parámetros</h2>
 <div id="params"></div>
 <button id="go">Simular</button>
 <div id="msg" role="status" aria-live="polite"></div>
</aside>
<main class="main">
 <h2>Resultados</h2>
 <div id="res"></div>
 <section class="vec">
  <div class="vhead">
   <h2>Vector de estado</h2>
   <ul class="legend">
    <li style="--c:var(--hd-rnd)">RND usado</li>
    <li style="--c:var(--hd-acc)">Acumuladores</li>
    <li style="--c:var(--hd-tmp)">Objetos temporales</li>
    <li style="--c:var(--sel)">Seleccionada</li>
    <li style="--c:var(--fin)">Última fila (instante X)</li>
   </ul>
  </div>
  <div id="wrap"><table id="vt"></table></div>
 </section>
</main>
</div>
<script>
const P=[['T','Tiempo a simular X (hs)',24],['maxIt','Máx. iteraciones (≤100000)',100000],['i','Mostrar i iteraciones',30],['j','Desde la hora j (hs)',0],
['cntC','COVID: llegadas por intervalo',4],['perC','COVID: intervalo (min)',15],['mF','Gripe: media entre llegadas (min)',5],['gmax','Máximo de personas por grupo',4],
['X','Vencimiento caja gripe X (hs)',2],['seg','Segundos por paciente',22],
['seed','Semilla',1234],['a','Multiplicador a',1714],['c','Constante aditiva c',1221],['m','Módulo m',3922]];
const $p=document.getElementById('params');
P.forEach(([k,l,v])=>$p.insertAdjacentHTML('beforeend','<label>'+l+'<input id="p_'+k+'" type="number" step="any" value="'+v+'"></label>'));
const fmt=m=>{let s=Math.round(m*60),h=Math.floor(s/3600);s-=h*3600;return h+':'+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const f=(v,d=3)=>v==null||v===''?'':v===Infinity?'—':(+v).toFixed(d);

// ---- vector de estado: solo se dibujan las filas visibles (permite hasta 100000 filas sin trabar el navegador) ----
const wrap=document.getElementById('wrap'),vt=document.getElementById('vt');
let FILAS=[],COLS=[],nFin=-1,altoFila=21,desde=-1;
const seleccion=new Set();
const BLOQUE=50;   // filas que se dibujan de más arriba y abajo de lo visible

function columnas(S){
 const used=key=>Math.max(0,...S.rows.map(s=>s[key]?s[key].map(g=>!!g).lastIndexOf(true)+1:0));
 const mc=used('tc'),mf=used('tf');
 const C=[['','Fila',s=>s.n],['','Evento',s=>s.ev],['','Reloj (min)',s=>f(s.t)],['','Hora',s=>fmt(s.t)],
 ['Llegada COVID','RND tam.',s=>f(s.R.sC,4)],['Llegada COVID','Tamaño',s=>s.R.sCn],['Llegada COVID','RND t.',s=>f(s.R.C,4)],['Llegada COVID','Entre llegadas',s=>f(s.R.Ct)],['Llegada COVID','Próx. llegada',s=>f(s.nc)],
 ['Llegada gripe','RND tam.',s=>f(s.R.sF,4)],['Llegada gripe','Tamaño',s=>s.R.sFn],['Llegada gripe','RND t.',s=>f(s.R.F,4)],['Llegada gripe','Entre llegadas',s=>f(s.R.Ft)],['Llegada gripe','Próx. llegada',s=>f(s.nf)],
 ['Próximos eventos','Fin atención',s=>s.fin==null?'—':f(s.fin)],['Próximos eventos','Venc. caja',s=>s.ven==null?'—':f(s.ven)],
 ['Enfermero','Estado',s=>s.st],['Enfermero','Próx. turno',s=>s.turn],['Enfermero','Lote N',s=>s.lote],
 ['Colas','Grupos COVID',s=>s.gC],['Colas','Pac. COVID pend.',s=>s.pC],['Colas','Grupos gripe',s=>s.gF],['Colas','Pac. gripe',s=>s.pF],
 ['Caja gripe','Dosis restantes',s=>s.box],
 ['Acumuladores','Cajas COVID',s=>s.A.cajasC],['Acumuladores','Grupos partidos',s=>s.A.gP],['Acumuladores','Σ espera (min)',s=>f(s.A.sP)]];
 for(let k=0;k<mc;k++)['Id','Tam.','Vac.','En lote','Estado','Llegada','1ª dosis'].forEach((l,q)=>C.push(['Grupo COVID '+(k+1),l,s=>{const g=s.tc&&s.tc[k];return g?(q>4?f(g[q],2):g[q]):''}]));
 for(let k=0;k<mf;k++)['Id','Tam.','Estado','Llegada'].forEach((l,q)=>C.push(['Grupo gripe '+(k+1),l,s=>{const g=s.tf&&s.tf[k];return g?(q>2?f(g[q],2):g[q]):''}]));
 // ancho fijo por columna (así no "baila" al hacer scroll): el texto más largo de una muestra de filas
 const paso=Math.max(1,Math.floor(FILAS.length/3000));
 C.forEach(c=>{let L=0;for(let r=0;r<FILAS.length;r+=paso)L=Math.max(L,String(c[2](FILAS[r])??'').length);
  L=Math.max(L,String(c[2](FILAS[FILAS.length-1])??'').length);c.w=Math.ceil(Math.max(L*7,c[1].length*8)+18)});
 return C;
}

function encabezado(){
 let h1='',h2='',i=0;
 while(i<COLS.length){let j=i;while(j<COLS.length&&COLS[j][0]===COLS[i][0])j++;h1+='<th colspan="'+(j-i)+'">'+COLS[i][0]+'</th>';i=j}
 COLS.forEach(c=>h2+='<th>'+c[1]+'</th>');
 const ancho=COLS.reduce((a,c)=>a+c.w,0);
 vt.style.width=ancho+'px';
 vt.innerHTML='<colgroup>'+COLS.map(c=>'<col style="width:'+c.w+'px">').join('')+'</colgroup><thead><tr>'+h1+'</tr><tr>'+h2+'</tr></thead><tbody></tbody>';
}

function fila(r){
 const s=FILAS[r],cl=(r===nFin?'fin':'')+(seleccion.has(r)?' sel':'');
 return '<tr data-r="'+r+'"'+(cl.trim()?' class="'+cl.trim()+'"':'')+'>'+COLS.map(c=>'<td>'+(c[2](s)??'')+'</td>').join('')+'</tr>';
}

function dibujar(forzar){
 const visibles=Math.ceil(wrap.clientHeight/altoFila);
 let ini=Math.floor(wrap.scrollTop/altoFila/BLOQUE)*BLOQUE-BLOQUE;
 ini=Math.max(0,ini);
 if(!forzar&&ini===desde)return;
 desde=ini;
 const fin=Math.min(FILAS.length,ini+visibles+3*BLOQUE);
 const esp=h=>'<tr class="esp"><td colspan="'+COLS.length+'" style="height:'+h+'px"></td></tr>';
 let html=ini>0?esp(ini*altoFila):'';
 for(let r=ini;r<fin;r++)html+=fila(r);
 if(fin<FILAS.length)html+=esp((FILAS.length-fin)*altoFila);
 vt.tBodies[0].innerHTML=html;
}

function render(S){
 FILAS=[...S.rows,S.last];nFin=S.rows.length;seleccion.clear();desde=-1;
 COLS=columnas(S);
 encabezado();
 wrap.scrollTop=0;
 dibujar(true);
 const tr=vt.tBodies[0].querySelector('tr[data-r]');
 if(tr){altoFila=tr.getBoundingClientRect().height;dibujar(true)}
}
wrap.addEventListener('scroll',()=>dibujar(false),{passive:true});
vt.addEventListener('click',e=>{const tr=e.target.closest('tbody tr[data-r]');if(!tr)return;const r=+tr.dataset.r;
 if(seleccion.has(r)){seleccion.delete(r);tr.classList.remove('sel')}else{seleccion.add(r);tr.classList.add('sel')}});

document.getElementById('go').onclick=async()=>{
 const p={};P.forEach(([k])=>p[k]=parseFloat(document.getElementById('p_'+k).value));
 p.maxIt=Math.min(100000,Math.max(1,p.maxIt));p.i=Math.min(p.i,p.maxIt);
 document.getElementById('msg').textContent='Simulando…';
 let r;
 try{r=await fetch('/api/simular',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})}
 catch(e){document.getElementById('msg').textContent='No hay conexión con el servidor: ejecutá "python app.py" y abrí http://127.0.0.1:5000 (no abras index.html con doble clic).';return}
 if(r.status===404){document.getElementById('msg').textContent='Esta página no la está sirviendo app.py: ejecutá "python app.py" y abrí http://127.0.0.1:5000.';return}
 if(!r.ok){document.getElementById('msg').textContent='Parámetros inválidos: revisá que no haya campos vacíos.';return}
 const S=await r.json(),A=S.A,prom=A.gP?A.sP/A.gP:0;
 const K=[[A.cajasC,'Cajas de vacuna COVID colocadas'],[f(prom)+' min ('+fmt(prom)+')','Espera promedio de los grupos COVID partidos ('+A.gP+' grupos)'],[S.n+' filas, reloj final '+fmt(S.t),S.last.ev]];
 document.getElementById('res').innerHTML=K.map(k=>'<div class="k"><b>'+k[0]+'</b><span>'+k[1]+'</span></div>').join('');
 document.getElementById('msg').textContent=S.rows.length?'Mostrando '+S.rows.length+' filas desde la hora '+p.j+' más la última fila.':'No hay filas a partir de esa hora: se muestra solo la última fila.';
 render(S);
};
document.getElementById('go').click();
</script></body></html>
